

fitxers:
  binding_csv: "Compound_OBP_binding.csv"
  info_csv:    "OBP_info_new.csv"
  carpeta_results: "results"
  carpeta_docking:  "docking"
  registre_docking: "docking/registre.csv"
  cache_smiles:     "docking/voc_smiles_cache.json"

executables:
  gnina_exe:  "gnina/gnina"
  p2rank_exe: "p2rank/prank"

urls:
